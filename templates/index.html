<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 法律助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* === RESET & VARIABLES === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-root:#0f1117;
  --bg-sidebar:#151823;
  --bg-chat:#181b25;
  --bg-card:#202432;
  --bg-input:#252a3a;
  --bg-hover:#2b3144;
  --border:#2a2b38;
  --border-light:#33344280;
  --text-primary:#e8e9ed;
  --text-secondary:#b3b7c8;
  --text-muted:#5f6175;
  --accent:#4f9cff;
  --accent-strong:#2f7df5;
  --accent-dim:#4f9cff24;
  --accent-glow:#4f9cff55;
  --gold:#f2b84b;
  --gold-dim:#f2b84b20;
  --user-bubble:#2d3a5c;
  --danger:#e5484d;
  --danger-dim:#e5484d18;
  --success:#30a46c;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --radius-xl:20px;
  --font-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
  --shadow-lg:0 8px 32px rgba(0,0,0,.45);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --transition:180ms ease;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-body);
  background:var(--bg-root);
  color:var(--text-primary);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* === AUTH PANEL === */
.auth-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-root);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% 0%,var(--accent-dim),transparent),
    radial-gradient(ellipse 40% 40% at 80% 80%,#6e3dcc15,transparent);
}
.auth-card{
  width:100%;max-width:400px;margin:0 20px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  padding:40px 36px 36px;
  box-shadow:var(--shadow-lg);
  animation:fadeUp .5s ease both;
}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo h1{font-size:1.5em;font-weight:600;margin-top:14px;letter-spacing:-.02em}
.auth-subtitle{color:var(--text-secondary);font-size:.88em;margin-top:6px}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:.8em;font-weight:500;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.03em}
.field-group input{
  width:100%;padding:11px 14px;
  background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-md);color:var(--text-primary);
  font-family:var(--font-body);font-size:.92em;
  outline:none;transition:border-color var(--transition);
}
.field-group input:focus{border-color:var(--accent)}
.field-group input::placeholder{color:var(--text-muted)}
.auth-message{
  min-height:20px;font-size:.82em;padding:4px 0;
  color:var(--danger);transition:color var(--transition);
}
.auth-message.success{color:var(--success)}
.btn-primary{
  width:100%;padding:12px;margin-top:4px;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--radius-md);
  font-family:var(--font-body);font-size:.92em;font-weight:600;
  cursor:pointer;transition:all var(--transition);
  letter-spacing:.01em;
}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{
  width:100%;padding:10px;margin-top:6px;
  background:transparent;border:none;
  color:var(--text-secondary);
  font-family:var(--font-body);font-size:.82em;
  cursor:pointer;transition:color var(--transition);
}
.btn-ghost:hover{color:var(--accent)}

/* === LAYOUT === */
.app-layout{
  display:flex;height:100vh;height:100dvh;
  background:var(--bg-root);
}

/* === SIDEBAR === */
.sidebar{
  width:280px;min-width:280px;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:20;
}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--border);
}
.sidebar-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95em;letter-spacing:-.01em}
.icon-btn{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text-secondary);
  cursor:pointer;transition:all var(--transition);flex-shrink:0;
}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
.danger-icon:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-dim)}
.toolbar-btn{
  height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border-light);border-radius:var(--radius-md);
  background:var(--bg-input);color:var(--text-primary);
  font-family:var(--font-body);font-weight:600;cursor:pointer;
  transition:all var(--transition);
}
.toolbar-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:#fff}
.session-list{
  flex:1;overflow-y:auto;padding:10px;
}
.session-item{
  padding:12px 14px;margin-bottom:2px;
  border-radius:var(--radius-md);
  cursor:pointer;transition:all var(--transition);
  position:relative;
  border:1px solid transparent;
}
.session-item:hover{background:var(--bg-hover)}
.session-item.active{background:var(--accent-dim);border-color:var(--accent-glow)}
.session-item .s-title{font-size:.87em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.session-item .s-meta{font-size:.73em;color:var(--text-muted);margin-top:3px}
.session-item.active .s-title{color:var(--accent)}
.session-item .s-delete{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;
  display:none;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:var(--radius-sm);
  color:var(--text-muted);cursor:pointer;transition:all var(--transition);
}
.session-item:hover .s-delete{display:flex}
.session-item .s-delete:hover{color:var(--danger);background:var(--danger-dim)}
.sidebar-footer{
  padding:14px 18px;border-top:1px solid var(--border);
}
.btn-sidebar-footer{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  background:transparent;border:1px solid var(--border);
  border-radius:var(--radius-md);
  color:var(--text-secondary);font-family:var(--font-body);font-size:.82em;
  cursor:pointer;transition:all var(--transition);
}
.btn-sidebar-footer:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light)}
.sidebar-overlay{
  display:none;position:fixed;inset:0;z-index:15;
  background:rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}

/* === CHAT AREA === */
.chat-main{
  flex:1;display:flex;flex-direction:column;
  min-width:0;background:var(--bg-chat);
}
.chat-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg-sidebar);
  flex-shrink:0;
}
.chat-header-info{flex:1;min-width:0}
.chat-header-info h2{font-size:.95em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{font-size:.73em;color:var(--text-muted)}
.mobile-menu{display:none}
.chat-container{
  flex:1;overflow-y:auto;padding:24px 20px;
  scroll-behavior:smooth;
}

/* === DOCUMENT LIBRARY === */
.doc-modal{
  position:fixed;inset:0;z-index:80;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.58);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  padding:20px;
}
.doc-modal.open{display:flex}
.doc-panel{
  width:min(1120px,100%);height:min(760px,92vh);
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  display:grid;grid-template-rows:auto auto 1fr;
  overflow:hidden;
}
.doc-panel-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
}
.doc-panel-title{min-width:0}
.doc-panel-header h3{font-size:1em;font-weight:650}
.doc-panel-header p{margin-top:4px;font-size:.76em;color:var(--text-muted)}
.doc-header-actions{display:flex;align-items:center;gap:10px}
.doc-status-chip{
  min-width:64px;text-align:center;
  padding:6px 10px;border:1px solid var(--border);
  border-radius:999px;color:var(--text-muted);font-size:.74em;
  background:var(--bg-input);
}
.doc-status-chip.error{color:var(--danger);border-color:var(--danger);background:var(--danger-dim)}
.doc-status-chip.success{color:var(--success);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.doc-toolbar{
  display:grid;grid-template-columns:minmax(260px,1fr) auto auto minmax(220px,.7fr) auto;
  gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  align-items:center;background:rgba(255,255,255,.015);
}
.doc-searchbox{position:relative;min-width:0}
.doc-searchbox svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);pointer-events:none;
}
.doc-toolbar input{
  min-width:0;background:var(--bg-input);border:1px solid var(--border);
  color:var(--text-primary);border-radius:var(--radius-md);
  padding:10px 12px;font-family:var(--font-body);outline:none;
}
.doc-searchbox input{width:100%;padding-left:36px}
.doc-toolbar input:focus{border-color:var(--accent)}
.doc-btn{
  height:38px;padding:0 12px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--bg-input);
  color:var(--text-secondary);font-family:var(--font-body);
  cursor:pointer;transition:all var(--transition);
}
.doc-btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-hover)}
.doc-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.doc-btn.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-dim)}
.doc-body{display:grid;grid-template-columns:380px 1fr;min-height:0}
.doc-results{
  border-right:1px solid var(--border);overflow:auto;padding:12px;
  background:rgba(0,0,0,.08);
}
.doc-result{
  border:1px solid transparent;border-radius:var(--radius-md);
  padding:12px;margin-bottom:9px;cursor:pointer;
  background:transparent;transition:all var(--transition);
}
.doc-result:hover,.doc-result.active{background:var(--bg-hover);border-color:var(--border-light);box-shadow:0 8px 20px rgba(0,0,0,.14)}
.doc-result-title{font-weight:600;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-result-meta{font-size:.72em;color:var(--text-muted);margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.doc-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 7px;border:1px solid var(--border);
  border-radius:999px;background:var(--bg-input);color:var(--text-muted);
}
.doc-pill.ok{color:var(--success);border-color:rgba(16,185,129,.32);background:rgba(16,185,129,.08)}
.doc-pill.warn{color:var(--danger);border-color:rgba(239,68,68,.32);background:var(--danger-dim)}
.doc-result-preview{font-size:.8em;color:var(--text-secondary);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-detail{min-width:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.doc-detail-empty{
  height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:.88em;text-align:center;
  border:1px dashed var(--border);border-radius:var(--radius-md);
  background:rgba(255,255,255,.015);
}
.doc-detail-title{font-size:1em;font-weight:600;word-break:break-all}
.doc-detail-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.doc-stat{
  border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--bg-input);padding:9px 10px;min-width:0;
}
.doc-stat span{display:block;color:var(--text-muted);font-size:.68em;margin-bottom:4px}
.doc-stat strong{display:block;color:var(--text-primary);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-preview{
  flex:1;min-height:180px;white-space:pre-wrap;word-break:break-word;
  background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:12px;color:var(--text-secondary);
  font-size:.84em;overflow:auto;
}
.doc-detail-actions{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:12px}

/* === INPUT === */
.input-wrapper{
  padding:14px 22px 18px;
  border-top:1px solid var(--border);
  background:var(--bg-sidebar);
  flex-shrink:0;
}
.input-bar{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:8px 8px 8px 18px;
  transition:border-color var(--transition);
}
.input-bar:focus-within{border-color:var(--accent)}
.input-bar textarea{
  flex:1;resize:none;border:none;outline:none;
  background:transparent;color:var(--text-primary);
  font-family:var(--font-body);font-size:.9em;
  line-height:1.5;padding:8px 0;
  max-height:140px;
}
.input-bar textarea::placeholder{color:var(--text-muted)}
.send-btn{
  width:44px;height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-strong);border:none;border-radius:var(--radius-md);
  color:#fff;cursor:pointer;
  transition:all var(--transition);
}
.send-btn:hover:not(:disabled){filter:brightness(1.15);transform:scale(1.04)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--text-muted)}
.research-btn{
  height:44px;flex-shrink:0;padding:0 16px;
  display:inline-flex;align-items:center;gap:8px;
  background:var(--gold);border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius-md);color:#17130b;
  font-family:var(--font-body);font-weight:700;cursor:pointer;
  transition:all var(--transition);
}
.research-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.research-btn:disabled{opacity:.45;cursor:not-allowed}
.input-hint{
  text-align:center;font-size:.7em;color:var(--text-muted);
  margin-top:8px;letter-spacing:.02em;
}

/* === MESSAGES === */
.msg{
  display:flex;gap:12px;margin-bottom:20px;
  animation:fadeUp .35s ease both;
  max-width:800px;margin-left:auto;margin-right:auto;
}
.msg.user{flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;flex-shrink:0;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:.75em;font-weight:600;
}
.msg.assistant .msg-avatar{background:var(--accent-dim);color:var(--accent)}
.msg.user .msg-avatar{background:var(--user-bubble);color:#8eacdf}
.msg-body{min-width:0;max-width:75%}
.msg-bubble{
  padding:12px 16px;
  border-radius:var(--radius-lg);
  font-size:.9em;line-height:1.7;
  word-break:break-word;
}
.msg.user .msg-bubble{
  background:var(--user-bubble);color:#dce4f2;
  border-bottom-right-radius:var(--radius-sm);
}
.msg.assistant .msg-bubble{
  background:var(--bg-card);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-bottom-left-radius:var(--radius-sm);
}
.msg-time{
  font-size:.7em;color:var(--text-muted);margin-top:5px;
  padding:0 4px;
}
.msg.user .msg-time{text-align:right}

/* === MARKDOWN === */
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{font-weight:600;margin:16px 0 8px;line-height:1.3}
.msg-bubble h1{font-size:1.25em}.msg-bubble h2{font-size:1.1em}.msg-bubble h3{font-size:1em}
.msg-bubble p{margin:6px 0}
.msg-bubble ul,.msg-bubble ol{margin:6px 0 6px 20px}
.msg-bubble li{margin:3px 0}
.msg-bubble blockquote{
  border-left:3px solid var(--accent);
  padding:6px 14px;margin:10px 0;
  background:var(--accent-dim);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  color:var(--text-secondary);
}
.msg-bubble code{
  font-family:var(--font-mono);font-size:.85em;
  background:var(--bg-input);padding:2px 6px;
  border-radius:4px;
}
.msg-bubble pre{
  background:var(--bg-root);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:14px;
  margin:10px 0;overflow-x:auto;
}
.msg-bubble pre code{background:transparent;padding:0;font-size:.82em}
.msg-bubble table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.88em}
.msg-bubble th,.msg-bubble td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.msg-bubble th{background:var(--bg-input);font-weight:600}
.msg-bubble a{color:var(--accent);text-decoration:none}
.msg-bubble a:hover{text-decoration:underline}
.msg-bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.msg-bubble strong{font-weight:600;color:var(--text-primary)}
.msg-bubble em{font-style:italic}
.citation-strip{
  margin-top:10px;padding:10px;border:1px solid var(--border);
  border-radius:var(--radius-md);background:rgba(255,255,255,.025);
}
.citation-strip-title{font-size:.74em;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.citation-list{display:flex;flex-wrap:wrap;gap:8px}
.citation-chip{
  padding:6px 9px;border:1px solid var(--accent-glow);
  border-radius:999px;background:var(--accent-dim);color:#dbeafe;
  font-size:.76em;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.verification-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:8px;padding:6px 9px;border-radius:999px;
  border:1px solid var(--border);font-size:.74em;color:var(--text-secondary);
}
.verification-badge.passed{color:var(--success);border-color:rgba(48,164,108,.45);background:rgba(48,164,108,.09)}
.verification-badge.warning{color:var(--gold);border-color:rgba(242,184,75,.45);background:var(--gold-dim)}
.verification-badge.failed{color:var(--danger);border-color:rgba(229,72,77,.45);background:var(--danger-dim)}
.side-panel{
  position:fixed;right:18px;top:76px;bottom:18px;width:min(420px,calc(100vw - 36px));
  z-index:90;background:var(--bg-card);border:1px solid var(--border-light);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  display:none;grid-template-rows:auto 1fr;overflow:hidden;
}
.side-panel.open{display:grid}
.side-panel-header{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--border)}
.side-panel-header h3{font-size:1em}
.side-panel-body{overflow:auto;padding:14px 16px;color:var(--text-secondary)}
.evidence-title{font-weight:700;color:var(--text-primary);margin-bottom:8px}
.evidence-meta{font-size:.78em;color:var(--text-muted);margin-bottom:10px}
.evidence-excerpt{white-space:pre-wrap;word-break:break-word;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px}
.research-modal{
  position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);padding:20px;
}
.research-modal.open{display:flex}
.research-card{
  width:min(520px,100%);background:var(--bg-card);border:1px solid var(--border-light);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:20px;
}
.research-card h3{font-size:1.05em;margin-bottom:8px}
.progress-track{height:10px;background:var(--bg-input);border-radius:999px;overflow:hidden;margin:14px 0}
.progress-fill{height:100%;width:0;background:var(--gold);transition:width var(--transition)}
.research-stage{color:var(--text-secondary);font-size:.86em}

/* === STREAMING CURSOR === */
.streaming-cursor::after{
  content:'';display:inline-block;
  width:2px;height:1em;vertical-align:text-bottom;
  background:var(--accent);margin-left:2px;
  animation:blink .7s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* === TYPING DOTS === */
.typing-dots{display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;
  background:var(--text-muted);
  animation:dotPulse 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

/* === EMPTY STATE === */
.empty-state{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;color:var(--text-muted);
  gap:16px;padding:40px;text-align:center;
  animation:fadeUp .5s ease both;
}
.empty-state svg{opacity:.25}
.empty-state h3{font-size:1.1em;font-weight:500;color:var(--text-secondary)}
.empty-state p{font-size:.85em;max-width:340px;line-height:1.6}
.empty-prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.empty-prompts button{
  padding:8px 16px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:20px;color:var(--text-secondary);
  font-family:var(--font-body);font-size:.8em;
  cursor:pointer;transition:all var(--transition);
}
.empty-prompts button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* === RESPONSIVE === */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20}
  .sidebar.open{transform:translateX(0)}
  .sidebar.open~.sidebar-overlay{display:block}
  .mobile-menu{display:flex}
  .msg-body{max-width:85%}
  .doc-modal{padding:8px}
  .doc-panel{height:96vh}
  .doc-panel-header{align-items:flex-start}
  .doc-toolbar{grid-template-columns:1fr auto;gap:8px}
  .doc-searchbox{grid-column:1 / -1}
  .doc-toolbar input[type=file]{grid-column:1 / -1;width:100%}
  .doc-toolbar .doc-btn:last-child{grid-column:1 / -1}
  .doc-body{grid-template-columns:1fr;grid-template-rows:240px 1fr}
  .doc-results{border-right:none;border-bottom:1px solid var(--border)}
  .doc-detail-meta{grid-template-columns:1fr}
}
@media(min-width:769px){
  .mobile-menu{display:none!important}
}

/* === ANIMATIONS === */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>
// ============================================================
//  STATE
// ============================================================
let currentSessionId = null;
let userId = null;
let isStreaming = false;
let authMode = 'login'; // 'login' | 'register'
let sessionCache = [];   // cached session list for delete-fallback
let selectedDocument = null;
let docSearchTimer = null;
let docSearchController = null;
let docSearchSeq = 0;
let citationStore = {};
let citationStoreSeq = 0;

// ============================================================
//  DOCUMENT LIBRARY
// ============================================================
function openDocLibrary() {
  document.getElementById('docModal').classList.add('open');
  renderDocEmpty();
  setDocStatus('就绪', '');
  setTimeout(() => {
    document.getElementById('docSearchInput').focus();
    searchDocuments();
  }, 50);
}

function closeDocLibrary() {
  document.getElementById('docModal').classList.remove('open');
}

function setDocStatus(message, type) {
  const el = document.getElementById('docStatus');
  if (!el) return;
  el.textContent = message || '';
  el.className = `doc-status-chip ${type || ''}`.trim();
}

function renderDocEmpty() {
  selectedDocument = null;
  document.getElementById('docDetail').innerHTML = `
    <div class="doc-detail-empty">选择左侧文档后查看预览、入库信息和删除操作</div>`;
}

function resetDocPanel() {
  document.getElementById('docSearchInput').value = '';
  document.getElementById('docResults').innerHTML = '';
  const input = document.getElementById('docUploadInput');
  if (input) input.value = '';
  renderDocEmpty();
  setDocStatus('就绪', '');
  searchDocuments();
}

function handleDocSearchInput() {
  clearTimeout(docSearchTimer);
  document.getElementById('docResults').innerHTML = '<div class="doc-result-meta">正在匹配...</div>';
  docSearchTimer = setTimeout(() => searchDocuments(), 300);
}

async function searchDocuments() {
  const keyword = document.getElementById('docSearchInput').value.trim();
  const list = document.getElementById('docResults');
  list.innerHTML = '<div class="doc-result-meta">搜索中...</div>';
  renderDocEmpty();
  setDocStatus('搜索中', '');

  if (docSearchController) docSearchController.abort();
  docSearchController = new AbortController();
  const seq = ++docSearchSeq;

  try {
    const res = await fetch(`/api/doc/search?keyword=${encodeURIComponent(keyword)}`, {
      signal: docSearchController.signal
    });
    const data = await res.json();
    if (seq !== docSearchSeq) return;
    if (!res.ok) throw new Error(data.detail || '搜索失败');
    renderDocResults(data.documents || []);
    setDocStatus(`${(data.documents || []).length} 个结果`, 'success');
  } catch (e) {
    if (e.name === 'AbortError') return;
    list.innerHTML = `<div class="doc-result-meta">${escapeHtml(e.message)}</div>`;
    setDocStatus('搜索失败', 'error');
  }
}

function renderDocResults(docs) {
  const list = document.getElementById('docResults');
  if (!docs.length) {
    list.innerHTML = '<div class="doc-result-meta">没有匹配的文档</div>';
    return;
  }
  list.innerHTML = docs.map((doc, index) => `
    <div class="doc-result" id="docResult${index}" onclick="selectDocument(${index})">
      <div class="doc-result-title">${escapeHtml(doc.filename || '未命名文档')}</div>
      <div class="doc-result-meta">
        <span class="doc-pill">${doc.article_count || 0} 个切片</span>
        <span class="doc-pill ${doc.file_exists ? 'ok' : 'warn'}">${doc.file_exists ? '文件正常' : '文件缺失'}</span>
      </div>
      <div class="doc-result-preview">${escapeHtml(doc.preview || '')}</div>
    </div>`).join('');
  window.__docSearchResults = docs;
}

async function selectDocument(index) {
  const docs = window.__docSearchResults || [];
  selectedDocument = docs[index];
  document.querySelectorAll('.doc-result').forEach(el => el.classList.remove('active'));
  const active = document.getElementById(`docResult${index}`);
  if (active) active.classList.add('active');

  const detail = document.getElementById('docDetail');
  detail.innerHTML = `
    <div>
      <div class="doc-detail-title">${escapeHtml(selectedDocument.filename || '')}</div>
      <div class="doc-result-meta">
        <span class="doc-pill">${selectedDocument.article_count || 0} 个切片</span>
        <span class="doc-pill ${selectedDocument.file_exists ? 'ok' : 'warn'}">${selectedDocument.file_exists ? '文件正常' : '文件缺失'}</span>
      </div>
    </div>
    <div class="doc-detail-meta">
      <div class="doc-stat"><span>文档名</span><strong>${escapeHtml(selectedDocument.filename || '-')}</strong></div>
      <div class="doc-stat"><span>切片数</span><strong>${selectedDocument.article_count || 0}</strong></div>
      <div class="doc-stat"><span>入库时间</span><strong>${escapeHtml(formatDocTime(selectedDocument.created_at))}</strong></div>
    </div>
    <div class="doc-preview" id="docPreview">加载中...</div>
    <div class="doc-detail-actions">
      <button class="doc-btn danger" onclick="deleteSelectedDocument()">删除</button>
    </div>`;

  try {
    const res = await fetch(`/api/doc/preview?doc_key=${encodeURIComponent(selectedDocument.doc_key)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '预览失败');
    document.getElementById('docPreview').textContent = data.content || '';
  } catch (e) {
    document.getElementById('docPreview').textContent = e.message;
  }
}

async function uploadDocument() {
  const input = document.getElementById('docUploadInput');
  const file = input && input.files && input.files[0];
  if (!file) {
    setDocStatus('请选择文档', 'error');
    return;
  }

  const form = new FormData();
  form.append('file', file);
  setDocStatus('上传并向量化中...', '');

  try {
    const res = await fetch('/api/doc/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '上传失败');
    setDocStatus(`上传成功，写入 ${data.inserted_count || 0} 条`, 'success');
    input.value = '';
    document.getElementById('docSearchInput').value = file.name.replace(/\.[^.]+$/, '');
    await searchDocuments();
  } catch (e) {
    setDocStatus(e.message, 'error');
  }
}

async function deleteSelectedDocument() {
  if (!selectedDocument) return;
  if (!confirm(`确认删除 ${selectedDocument.filename}？`)) return;
  setDocStatus('删除中...', '');

  try {
    const res = await fetch('/api/doc/delete', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_key: selectedDocument.doc_key })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '删除失败');
    setDocStatus(`删除成功，移除 ${data.deleted_count || 0} 条`, 'success');
    selectedDocument = null;
    await searchDocuments();
  } catch (e) {
    setDocStatus(e.message, 'error');
  }
}

function formatDocTime(value) {
  if (!value) return '-';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString('zh-CN', { hour12: false });
}

// ============================================================
//  INIT
// ============================================================
window.addEventListener('load', async () => {
  setupTextarea();
  const savedUserId = localStorage.getItem('userId');
  const savedSessionId = localStorage.getItem('currentSessionId');

  if (savedUserId) {
    try {
      const res = await fetch(`/api/sessions?user_id=${encodeURIComponent(savedUserId)}`);
      if (res.ok) {
        userId = savedUserId;
        const data = await res.json();
        showMainUI();
        displaySessionList(data.sessions || []);
        if (savedSessionId) {
          await loadSession(savedSessionId);
        } else if (data.sessions && data.sessions.length > 0) {
          await loadSession(data.sessions[0].session_id);
        } else {
          showEmptyState();
        }
        return;
      }
    } catch (e) { console.warn('Session validation failed:', e); }
  }
  clearStoredCredentials();
  showAuthPanel();
});

// ============================================================
//  AUTH
// ============================================================
function toggleAuthMode() {
  const title = document.getElementById('authTitle');
  const subtitle = document.getElementById('authSubtitle');
  const btn = document.getElementById('authActionBtn');
  const switchText = document.getElementById('authSwitchText');
  const msg = document.getElementById('authMessage');
  const emailGroup = document.getElementById('emailGroup');
  const codeGroup = document.getElementById('codeGroup');
  const labelUsername = document.getElementById('labelUsername');
  const loginUsername = document.getElementById('loginUsername');
  msg.textContent = '';
  msg.className = 'auth-message';

  if (authMode === 'login') {
    authMode = 'register';
    title.textContent = '创建账号';
    subtitle.textContent = '注册后即可开始咨询';
    btn.textContent = '注册';
    switchText.textContent = '已有账号？登录';
    emailGroup.style.display = '';
    codeGroup.style.display = '';
    labelUsername.textContent = '用户名';
    loginUsername.placeholder = '请输入用户名';
  } else {
    authMode = 'login';
    title.textContent = 'AI 法律助手';
    subtitle.textContent = '登录以开始咨询';
    btn.textContent = '登录';
    switchText.textContent = '没有账号？注册';
    emailGroup.style.display = 'none';
    codeGroup.style.display = 'none';
    labelUsername.textContent = '用户名 / 邮箱';
    loginUsername.placeholder = '请输入用户名或邮箱';
  }
}

async function handleAuth() {
  if (authMode === 'login') await login();
  else await register();
}

async function login() {
  const account = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('authMessage');
  msg.className = 'auth-message';

  if (!account || !password) { msg.textContent = '请输入用户名/邮箱和密码'; return; }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password })
    });
    const data = await res.json();
    if (res.ok && data.user_id) {
      userId = data.user_id;
      localStorage.setItem('userId', userId);
      showMainUI();
      // Load existing sessions instead of always creating new
      await refreshSessionList();
      if (sessionCache.length > 0) {
        await loadSession(sessionCache[0].session_id);
      } else {
        await createNewSession();
      }
    } else {
      msg.textContent = data.detail || '登录失败';
    }
  } catch (e) {
    msg.textContent = '网络错误，请检查服务是否启动';
  }
}

async function register() {
  const username = document.getElementById('loginUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const code = document.getElementById('regCode').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('authMessage');
  msg.className = 'auth-message';

  if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }
  if (!email) { msg.textContent = '请输入邮箱'; return; }
  if (!code) { msg.textContent = '请输入验证码'; return; }
  if (password.length < 6) { msg.textContent = '密码至少 6 位'; return; }

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email, code })
    });
    const data = await res.json();
    if (res.ok && data.user_id) {
      msg.textContent = '注册成功，正在跳转登录…';
      msg.className = 'auth-message success';
      setTimeout(() => toggleAuthMode(), 1200);
    } else {
      msg.textContent = data.detail || '注册失败';
    }
  } catch (e) {
    msg.textContent = '网络错误，请检查服务是否启动';
  }
}

// ============================================================
//  SEND VERIFICATION CODE
// ============================================================
let codeCooldown = 0;
let codeCooldownTimer = null;

async function handleSendCode() {
  const email = document.getElementById('regEmail').value.trim();
  const msg = document.getElementById('authMessage');
  const btn = document.getElementById('sendCodeBtn');
  msg.className = 'auth-message';

  if (!email) { msg.textContent = '请先输入邮箱'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = '邮箱格式不正确'; return; }
  if (codeCooldown > 0) return;

  btn.disabled = true;
  try {
    const res = await fetch('/api/send_code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = '验证码已发送，请查收邮箱';
      msg.className = 'auth-message success';
      startCodeCooldown(60);
    } else {
      msg.textContent = data.detail || '发送失败';
      btn.disabled = false;
    }
  } catch (e) {
    msg.textContent = '网络错误，请检查服务是否启动';
    btn.disabled = false;
  }
}

function startCodeCooldown(seconds) {
  const btn = document.getElementById('sendCodeBtn');
  codeCooldown = seconds;
  btn.disabled = true;
  btn.textContent = `${codeCooldown}s`;
  codeCooldownTimer = setInterval(() => {
    codeCooldown--;
    if (codeCooldown <= 0) {
      clearInterval(codeCooldownTimer);
      codeCooldownTimer = null;
      codeCooldown = 0;
      btn.disabled = false;
      btn.textContent = '发送验证码';
    } else {
      btn.textContent = `${codeCooldown}s`;
    }
  }, 1000);
}

async function createNewSession() {
  if (!userId) return;
  try {
    const res = await fetch(`/api/new_session?user_id=${encodeURIComponent(userId)}`, { method: 'POST' });
    const data = await res.json();
    if (data.session_id) {
      currentSessionId = data.session_id;
      localStorage.setItem('currentSessionId', currentSessionId);
      clearChat();
      showEmptyState();
      updateChatHeader('新对话', '');
      document.getElementById('deleteCurrentBtn').style.display = '';
      await refreshSessionList();
    }
  } catch (e) {
    console.error('Create session error:', e);
  }
}

async function refreshSessionList() {
  if (!userId) return;
  try {
    const res = await fetch(`/api/sessions?user_id=${encodeURIComponent(userId)}`);
    const data = await res.json();
    sessionCache = data.sessions || [];
    displaySessionList(sessionCache);
  } catch (e) {
    console.error('Refresh sessions error:', e);
  }
}

function displaySessionList(sessions) {
  sessionCache = sessions;
  const list = document.getElementById('sessionList');
  if (!sessions.length) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:.82em">暂无会话</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const active = s.session_id === currentSessionId ? 'active' : '';
    const id8 = s.session_id.slice(-8);
    const count = s.message_count || 0;
    return `<div class="session-item ${active}" onclick="loadSession('${s.session_id}')">
      <div class="s-title">会话 ${id8}</div>
      <div class="s-meta">${count} 条消息</div>
      <button class="s-delete" onclick="event.stopPropagation();deleteSession('${s.session_id}')" title="删除">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
}

async function loadSession(sessionId) {
  if (!userId) return;
  try {
    const res = await fetch(`/api/sessions/${sessionId}?user_id=${encodeURIComponent(userId)}`);
    if (!res.ok) throw new Error('会话不存在');
    const data = await res.json();
    currentSessionId = sessionId;
    localStorage.setItem('currentSessionId', sessionId);
    clearChat();
    const session = data.session;
    if (session.conversation_history && session.conversation_history.length > 0) {
      session.conversation_history.forEach(m => {
        addMessage(m.is_user ? 'user' : 'assistant', m.content, m.timestamp);
      });
    } else {
      showEmptyState();
    }
    updateChatHeader('会话 ' + sessionId.slice(-8), `${(session.conversation_history||[]).length} 条消息`);
    document.getElementById('deleteCurrentBtn').style.display = '';
    refreshSessionList();
    // Close mobile sidebar
    document.getElementById('sidebar').classList.remove('open');
  } catch (e) {
    console.error('Load session error:', e);
  }
}

async function deleteSession(sessionId) {
  if (!userId) return;
  if (!confirm('确定要删除这个会话吗？')) return;
  try {
    const res = await fetch(`/api/sessions/${sessionId}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE' });
    if (res.ok) {
      await refreshSessionList();
      if (currentSessionId === sessionId) {
        currentSessionId = null;
        localStorage.removeItem('currentSessionId');
        // Fall back to next available session instead of creating new one
        if (sessionCache.length > 0) {
          await loadSession(sessionCache[0].session_id);
        } else {
          clearChat();
          showEmptyState();
          updateChatHeader('新对话', '');
          document.getElementById('deleteCurrentBtn').style.display = 'none';
        }
      }
    } else {
      const err = await res.json();
      console.error('Delete failed:', err.detail);
    }
  } catch (e) {
    console.error('Delete session error:', e);
  }
}

async function deleteCurrentSession() {
  if (!currentSessionId) return;
  await deleteSession(currentSessionId);
}

// ============================================================
//  CHAT — STREAMING
// ============================================================
async function sendMessage() {
  const textarea = document.getElementById('messageInput');
  const text = textarea.value.trim();
  if (!text || isStreaming || !currentSessionId || !userId) return;

  // Remove empty state if present
  const emptyEl = document.querySelector('.empty-state');
  if (emptyEl) emptyEl.remove();

  addMessage('user', text);
  textarea.value = '';
  autoResizeTextarea();
  isStreaming = true;
  updateSendBtn();

  // Create assistant message bubble for streaming
  const { bubble, wrapper } = createStreamingBubble();

  let fullText = '';
  let responseMeta = { citations: [], verification: {} };
  let streamSuccess = false;
  let wasReallyStreamed = false;

  try {
    // Try streaming endpoint first
    const url = `/api/chat/stream?user_id=${encodeURIComponent(userId)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentSessionId })
    });

    if (res.ok && res.headers.get('content-type')?.includes('text/event-stream')) {
      // SSE stream
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const payload = line.slice(6);
            if (payload === '[DONE]') { streamSuccess = true; break; }
            let json = null;
            try {
              json = JSON.parse(payload);
            } catch {
              // Plain text chunk
              fullText += payload;
              renderStreamContent(bubble, fullText);
              scrollToBottom();
              continue;
            }

            if (json.type === 'metadata') {
              responseMeta = {
                citations: json.citations || [],
                verification: json.verification || {}
              };
              continue;
            }
            if (json.type === 'status') {
              continue;
            }
            if (json.type === 'error') {
              throw new Error(json.message || '流式请求失败');
            }
            const chunk = json.content || json.delta || json.text || json.choices?.[0]?.delta?.content || '';
            if (chunk) {
              fullText += chunk;
              renderStreamContent(bubble, fullText);
              scrollToBottom();
            }
          }
        }
        if (streamSuccess) break;
      }
      streamSuccess = true;
      wasReallyStreamed = true;
    } else if (res.ok) {
      // Non-streaming JSON response — fallback
      const data = await res.json();
      fullText = data.response || data.content || data.message || JSON.stringify(data);
      responseMeta = { citations: data.citations || [], verification: data.verification || {} };
      streamSuccess = true;
    } else {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || `请求失败 (${res.status})`);
    }
  } catch (err) {
    // Fallback: try original /api/chat endpoint (non-streaming)
    if (!streamSuccess) {
      try {
        const url2 = `/api/chat?user_id=${encodeURIComponent(userId)}`;
        const res2 = await fetch(url2, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: currentSessionId })
        });
        const data2 = await res2.json();
        if (res2.ok) {
          fullText = data2.response || data2.content || data2.message || '';
          responseMeta = { citations: data2.citations || [], verification: data2.verification || {} };
          streamSuccess = true;
        } else {
          throw new Error(data2.detail || '请求失败');
        }
      } catch (err2) {
        fullText = '请求出错: ' + (err2.message || err.message);
      }
    }
  }

  // Finalize
  if (fullText && wasReallyStreamed) {
    // Already rendered progressively, just remove cursor
    finalizeStreamBubble(bubble, fullText);
    renderMessageExtras(bubble, responseMeta.citations, responseMeta.verification);
    isStreaming = false;
    updateSendBtn();
  } else if (fullText) {
    // Non-streamed response: simulate typewriter effect
    await typewriterReveal(bubble, fullText);
    renderMessageExtras(bubble, responseMeta.citations, responseMeta.verification);
    isStreaming = false;
    updateSendBtn();
  } else {
    finalizeStreamBubble(bubble, '(空回复)');
    isStreaming = false;
    updateSendBtn();
  }
  refreshSessionList();
}

function createStreamingBubble() {
  const container = document.getElementById('chatContainer');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg assistant';
  wrapper.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-body">
      <div class="msg-bubble streaming-cursor">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
      <div class="msg-time">智能助手 · ${formatTime()}</div>
    </div>`;
  container.appendChild(wrapper);
  scrollToBottom();
  const bubble = wrapper.querySelector('.msg-bubble');
  return { bubble, wrapper };
}

function renderStreamContent(bubble, text) {
  try {
    bubble.innerHTML = marked.parse(text);
  } catch {
    bubble.textContent = text;
  }
  bubble.classList.add('streaming-cursor');
}

function finalizeStreamBubble(bubble, text) {
  try {
    bubble.innerHTML = marked.parse(text);
  } catch {
    bubble.textContent = text;
  }
  bubble.classList.remove('streaming-cursor');
}

/**
 * Typewriter effect: reveals text character-by-character when the full
 * response arrives at once (non-streaming fallback). Uses variable speed —
 * faster for longer texts, with small pauses at punctuation for natural feel.
 */
async function typewriterReveal(bubble, fullText) {
  const len = fullText.length;
  // Base interval: 15–35ms per char, faster for long texts
  const baseInterval = len > 800 ? 10 : len > 300 ? 18 : 28;
  // Chunk size: reveal multiple chars per frame for long texts
  const chunkSize = len > 1000 ? 4 : len > 400 ? 3 : len > 150 ? 2 : 1;

  let pos = 0;
  bubble.classList.add('streaming-cursor');

  return new Promise(resolve => {
    function tick() {
      pos += chunkSize;
      if (pos >= len) pos = len;

      const partial = fullText.slice(0, pos);
      try {
        bubble.innerHTML = marked.parse(partial);
      } catch {
        bubble.textContent = partial;
      }
      bubble.classList.add('streaming-cursor');
      scrollToBottom();

      if (pos >= len) {
        bubble.classList.remove('streaming-cursor');
        resolve();
        return;
      }

      // Variable delay: pause slightly at sentence-ending punctuation
      const lastChar = fullText[pos - 1];
      let delay = baseInterval;
      if ('。！？\n'.includes(lastChar)) delay += 80;
      else if ('，、；：,.;:'.includes(lastChar)) delay += 30;

      setTimeout(tick, delay);
    }
    // Small initial delay to show the dots animation briefly
    setTimeout(tick, 300);
  });
}

// ============================================================
//  UI HELPERS
// ============================================================
function addMessage(role, content, timeStr, meta) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = role === 'user' ? '你' : 'AI';
  const label = role === 'user' ? '你' : '智能助手';
  const time = timeStr || formatTime();

  let rendered;
  try { rendered = marked.parse(content); }
  catch { rendered = escapeHtml(content); }

  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-bubble">${rendered}</div>
      <div class="msg-time">${label} · ${time}</div>
    </div>`;
  container.appendChild(div);
  if (role === 'ai' || role === 'assistant') {
    const bubble = div.querySelector('.msg-bubble');
    renderMessageExtras(bubble, meta?.citations || [], meta?.verification || {});
  }
  scrollToBottom();
}

function renderMessageExtras(bubble, citations, verification) {
  if (!bubble) return;
  const body = bubble.parentElement;
  body.querySelectorAll('.citation-strip,.verification-badge').forEach(el => el.remove());
  if (verification && verification.status) {
    body.insertAdjacentHTML('beforeend', renderVerificationBadge(verification));
  }
  if (citations && citations.length) {
    const storeId = `citations_${++citationStoreSeq}`;
    citationStore[storeId] = citations;
    body.insertAdjacentHTML('beforeend', renderCitationStrip(citations, storeId));
  }
}

function renderCitationStrip(citations, storeId) {
  const chips = citations.map((c, index) => `
    <button class="citation-chip" onclick="openEvidencePanel('${storeId}', ${index})">[${c.citation_id}] ${escapeHtml(c.source_label || c.filename || '证据')}</button>
  `).join('');
  return `
    <div class="citation-strip">
      <div class="citation-strip-title"><span>引用依据</span><span>${citations.length} 条</span></div>
      <div class="citation-list">${chips}</div>
    </div>`;
}

function renderVerificationBadge(verification) {
  const labelMap = { passed: '证据校验通过', warning: '部分结论需复核', failed: '证据校验未通过' };
  const status = verification.status || 'warning';
  const warnings = (verification.warnings || []).join('\n');
  return `<div class="verification-badge ${status}" title="${escapeHtml(warnings)}">${labelMap[status] || '证据校验'}</div>`;
}

function openEvidencePanel(storeId, index) {
  const evidence = (citationStore[storeId] || [])[index];
  if (!evidence) return;
  document.getElementById('evidencePanelBody').innerHTML = `
    <div class="evidence-title">[${evidence.citation_id}] ${escapeHtml(evidence.source_label || evidence.filename || '证据')}</div>
    <div class="evidence-meta">切片：${escapeHtml(evidence.chunk_id || '-')}<br>内容指纹：${escapeHtml(evidence.content_hash || '-')}</div>
    <div class="evidence-excerpt">${escapeHtml(evidence.excerpt || '')}</div>`;
  document.getElementById('evidencePanel').classList.add('open');
}

function closeEvidencePanel() {
  document.getElementById('evidencePanel').classList.remove('open');
}

async function startDeepResearch() {
  const textarea = document.getElementById('messageInput');
  const question = textarea.value.trim();
  if (!question || isStreaming || !currentSessionId || !userId) return;
  const emptyEl = document.querySelector('.empty-state');
  if (emptyEl) emptyEl.remove();
  addMessage('user', `深度研究：${question}`);
  textarea.value = '';
  autoResizeTextarea();
  updateSendBtn();
  const modal = document.getElementById('researchModal');
  modal.classList.add('open');
  updateResearchProgress(5, '正在创建研究任务');

  try {
    const res = await fetch('/api/research/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: currentSessionId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '创建研究任务失败');
    await pollResearchJob(data.job_id);
  } catch (e) {
    updateResearchProgress(100, e.message);
    setTimeout(() => modal.classList.remove('open'), 1200);
  } finally {
    isStreaming = false;
    updateSendBtn();
  }
}

async function pollResearchJob(jobId) {
  while (true) {
    const statusRes = await fetch(`/api/research/status/${encodeURIComponent(jobId)}`);
    const status = await statusRes.json();
    if (!statusRes.ok) throw new Error(status.detail || '查询研究任务失败');
    updateResearchProgress(status.progress || 0, status.stage || '研究中');

    if (status.status === 'completed' || status.status === 'failed') {
      const resultRes = await fetch(`/api/research/result/${encodeURIComponent(jobId)}`);
      const result = await resultRes.json();
      if (!resultRes.ok) throw new Error(result.detail || '读取研究结果失败');
      document.getElementById('researchModal').classList.remove('open');
      addMessage('assistant', result.report || '深度研究没有返回内容。', null, {
        citations: result.citations || [],
        verification: result.verification || {}
      });
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 1200));
  }
}

function updateResearchProgress(progress, stage) {
  document.getElementById('researchProgress').style.width = `${Math.max(0, Math.min(100, progress))}%`;
  document.getElementById('researchStage').textContent = stage;
}

function showEmptyState() {
  const container = document.getElementById('chatContainer');
  container.innerHTML = `
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <h3>AI 法律助手</h3>
      <p>您好，我是您的 AI 法律助手。您可以向我咨询法律问题，我会尽力为您提供参考信息。</p>
      <div class="empty-prompts">
        <button onclick="quickPrompt('劳动合同到期不续签，公司需要赔偿吗？')">劳动合同纠纷</button>
        <button onclick="quickPrompt('租房合同中哪些条款需要注意？')">租房合同</button>
        <button onclick="quickPrompt('交通事故责任如何划分？')">交通事故</button>
      </div>
    </div>`;
}

function quickPrompt(text) {
  const textarea = document.getElementById('messageInput');
  textarea.value = text;
  autoResizeTextarea();
  updateSendBtn();
  sendMessage();
}

function clearChat() {
  document.getElementById('chatContainer').innerHTML = '';
}

function updateChatHeader(title, meta) {
  document.getElementById('chatTitle').textContent = title;
  document.getElementById('chatMeta').textContent = meta;
}

function scrollToBottom() {
  const c = document.getElementById('chatContainer');
  c.scrollTop = c.scrollHeight;
}

function formatTime(ts) {
  if (ts) return ts;
  const d = new Date();
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============================================================
//  TEXTAREA AUTO-RESIZE + KEY HANDLING
// ============================================================
function setupTextarea() {
  const ta = document.getElementById('messageInput');
  ta.addEventListener('input', () => { autoResizeTextarea(); updateSendBtn(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    // Shift+Enter = newline (default behavior, no prevention needed)
  });
  // Auth inputs: Enter to submit
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
  });
  document.getElementById('loginUsername').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
  });
}

function autoResizeTextarea() {
  const ta = document.getElementById('messageInput');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
}

function updateSendBtn() {
  const btn = document.getElementById('sendBtn');
  const researchBtn = document.getElementById('researchBtn');
  const ta = document.getElementById('messageInput');
  btn.disabled = isStreaming || !ta.value.trim();
  if (researchBtn) researchBtn.disabled = isStreaming || !ta.value.trim();
}
